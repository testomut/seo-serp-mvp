# Runs the pipeline every day and on demand (Actions tab -> "Run workflow", or /run in the bot).
# GitHub wipes the machine after each run, so the database is committed back to the repository.
name: daily

on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC
  workflow_dispatch:

concurrency: daily-run    # never two runs at the same time

permissions:
  contents: write         # needed to commit data/serp.db and results.xlsx

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Save Google credentials to a file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        if: env.GOOGLE_CREDENTIALS_JSON != ''
        run: echo "$GOOGLE_CREDENTIALS_JSON" > google-credentials.json

      - name: Run pipeline
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_FILE: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' && 'google-credentials.json' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/serp.db results.xlsx
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push
